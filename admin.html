<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin | Latha Oil Mill</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="top"><div class="wrap"><span class="brand">Shop admin</span><nav><button class="cart-btn" id="logout" type="button" hidden>Sign out</button></nav></div></header>
  <main class="wrap page">
    <form id="login" class="panel" style="max-width:420px">
      <div class="field"><label for="tok">Admin token</label><input id="tok" type="password" autocomplete="current-password" required></div>
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn" type="submit">Sign in</button>
    </form>

    <div id="app" hidden>
      <div class="tabs" id="mainTabs">
        <button data-tab="orders" class="on" type="button">Orders</button>
        <button data-tab="products" type="button">Products</button>
      </div>

      <section id="ordersTab">
        <div class="tabs" id="statusTabs"></div>
        <div class="tablewrap"><table>
          <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Courier / tracking</th><th></th></tr></thead>
          <tbody id="orderRows"></tbody>
        </table></div>
      </section>

      <section id="productsTab" hidden>
        <div class="tablewrap"><table>
          <thead><tr><th>Name</th><th>Size</th><th>Price (₹)</th><th>Stock</th><th>Active</th><th></th></tr></thead>
          <tbody id="productRows"></tbody>
        </table></div>
        <h3 style="margin:24px 0 8px">Add a product</h3>
        <form id="newProduct" class="panel two" novalidate>
          <div class="field"><label>Name</label><input name="name" required></div>
          <div class="field"><label>Size (e.g. 1 L)</label><input name="size" required></div>
          <div class="field"><label>Price (₹)</label><input name="priceRupees" type="number" min="1" step="0.01" required></div>
          <div class="field"><label>Stock</label><input name="stock" type="number" min="0" step="1" value="0" required></div>
          <div class="field" style="grid-column:1/-1"><label>Description</label><input name="description"></div>
          <p class="err" id="npErr" style="grid-column:1/-1"></p>
          <div><button class="btn" type="submit">Add product</button></div>
        </form>
      </section>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="/js/admin.js"></script>
</body>
</html>
